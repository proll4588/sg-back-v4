# Student #
type StudentGroup {
  id: Int!
  title: String!
}

type Student {
  passbookNumber: Int!
  name: String!
  Group: StudentGroup!
}
# ======= #

# User #
type UserRole {
  id: Int!
  title: String!
}

type User {
  id: Int!
  login: String!
  Role: UserRole!
}
# ==== #

# Employee #
type EmployeePosition {
  id: Int!
  title: String!
}

type Employee {
  id: Int!
  name: String!
  email: String!
  User: User!
  EmployeePosition: EmployeePosition!
}
# ==== #
